name: Build ProxyGPT

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
        type: string

jobs:
  build:
    # macos-15 is an Apple Silicon (arm64) GitHub-hosted runner.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build arm64 binary
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          make clean
          make CC=clang CFLAGS="-Wall -Wextra -Wpedantic -O2 -arch arm64"
          test -x ProxyGPT.app/Contents/MacOS/launcher
          file ProxyGPT.app/Contents/MacOS/launcher

      - name: Create archive
        run: |
          set -euxo pipefail
          ditto -c -k --sequesterRsrc --keepParent ProxyGPT.app ProxyGPT.zip
          test -s ProxyGPT.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyGPT-arm64
          path: ProxyGPT.zip
          if-no-files-found: error
          retention-days: 30
