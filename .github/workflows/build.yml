name: Build ProxyGPT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 is an Apple Silicon (arm64) GitHub-hosted runner.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build arm64 binary
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          make clean
          make CC=clang CFLAGS="-Wall -Wextra -Wpedantic -O2 -arch arm64"
          test -x ProxyGPT.app/Contents/MacOS/launcher
          file ProxyGPT.app/Contents/MacOS/launcher

      - name: Create archive
        run: |
          set -euxo pipefail
          ditto -c -k --sequesterRsrc --keepParent ProxyGPT.app ProxyGPT.zip
          test -s ProxyGPT.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyGPT-arm64
          path: ProxyGPT.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Prefer a Release matching the selected branch/tag. If the workflow
          # was started from a branch, use the latest published Release.
          release_tag="${GITHUB_REF_NAME#refs/tags/}"
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_tag="$(gh release view \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq .tagName 2>/dev/null || true)"
          fi

          if [ -n "$release_tag" ]; then
            echo "Uploading ProxyGPT.zip to Release '$release_tag'"
            gh release upload "$release_tag" ProxyGPT.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "No published Release was found; the archive is available in Actions artifacts only."
          fi
