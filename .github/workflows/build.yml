name: Build ProxyGPT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 is an Apple Silicon (arm64) GitHub-hosted runner.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build arm64 binary
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "arm64"
          make clean
          make CC=clang CFLAGS="-Wall -Wextra -Wpedantic -O2 -arch arm64"
          test -x ProxyGPT.app/Contents/MacOS/launcher
          file ProxyGPT.app/Contents/MacOS/launcher

      - name: Create archive
        run: |
          set -euxo pipefail
          ditto -c -k --sequesterRsrc --keepParent ProxyGPT.app ProxyGPT.zip
          test -s ProxyGPT.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyGPT-arm64
          path: ProxyGPT.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: ${{ github.ref_type == 'tag' || startsWith(github.ref_name, 'release/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="${GITHUB_REF_NAME#release/}"
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Uploading ProxyGPT.zip to existing Release '$release_tag'"
            gh release upload "$release_tag" ProxyGPT.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating Release '$release_tag' and uploading ProxyGPT.zip"
            gh release create "$release_tag" ProxyGPT.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "ProxyGPT $release_tag" \
              --generate-notes \
              --verify-tag
          fi

      - name: Explain missing release upload
        if: ${{ github.ref_type != 'tag' && !startsWith(github.ref_name, 'release/') }}
        run: echo "Build completed. Release upload is skipped because the selected ref is not a tag or release/* branch."
